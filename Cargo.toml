[package]
name = "sedd-core"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.33", features = ["std"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tokio-util = "0.7"
bytes = "1.5"
crc = "3.0"
memmap2 = "0.9"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
once_cell = "1.19"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[[bench]]
name = "seed_benchmarks"
harness = false
